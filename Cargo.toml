# cl's app mode (craft-libs docs/development.md, "App workspaces"): every command selects these packages,
# so egui, eframe and the craft crates resolve to one feature set and build once per target dir.
[workspace.metadata.cl]
selection = ["filmcraft", "filmcraft-audio-dsp", "filmcraft-automation", "filmcraft-bitstream", "filmcraft-captions", "filmcraft-cfb", "filmcraft-cli", "filmcraft-codecs", "filmcraft-color", "filmcraft-dng", "filmcraft-edit", "filmcraft-engine", "filmcraft-export", "filmcraft-format", "filmcraft-frame", "filmcraft-geom", "filmcraft-golden", "filmcraft-gpu", "filmcraft-interchange", "filmcraft-isobmff", "filmcraft-matroska", "filmcraft-media", "filmcraft-platform", "filmcraft-project", "filmcraft-render", "filmcraft-scopes", "filmcraft-speech", "filmcraft-testkit", "filmcraft-text", "filmcraft-time", "filmcraft-tts", "filmcraft-tts-text", "filmcraft-ui-egui", "filmcraft-web"]
tracked = ["egui", "eframe", "craft-ui", "craft-update", "craft-window", "craft-keymap", "craft-i18n", "craft-media", "craft-audio", "craft-video", "craft-timeline"]
# Build scripts track these (the app's Windows resources, the fonts directory): a value in one command and
# not the next rebuilds everything above them. Fonts come from one craft-fonts checkout for every build.
unset_env = ["FILMCRAFT_REQUIRE_WINRES", "CRAFT_FONTS_REQUIRED"]
set_env = { RUST_MIN_STACK = "8388608" }

