[package]
name = "filmcraft-android"
description = "FilmCraft on Android: eframe mobile runner, wgpu (Vulkan/GLES), touch controls"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[lib]
crate-type = ["cdylib"]

[package.metadata.android]
package = "ai.storyteller.filmcraft"
apk_name = "FilmCraft"
# generated by `cargo xtask android` (launcher icons copied from assets/app-icon, plus res/)
resources = "../../target/android-res"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]

[package.metadata.android.application]
icon = "@mipmap/ic_launcher"
label = "FilmCraft"

[package.metadata.android.application.activity]
label = "FilmCraft"
orientation = "sensorLandscape"

[package.metadata.android.sdk]
target_sdk_version = 35
min_sdk_version = 24

# Storage access: shared media (Android 13+) and, up to Android 12, external storage. The user
# grants it in system Settings > Apps > FilmCraft > Permissions.
[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_VIDEO"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_AUDIO"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_IMAGES"

# The in-app file browser is plain egui and is built (and tested) on every target.
[dependencies]
filmcraft-ui-egui = { workspace = true }
egui = { workspace = true }

# The app itself is android-only: on other targets only the browser is built (so
# `cargo test --workspace` and clippy stay cheap).
[target.'cfg(target_os = "android")'.dependencies]
filmcraft-engine = { workspace = true }
eframe ={ workspace = true, features = ["default_fonts", "wgpu", "android-native-activity"] }
log = { workspace = true }
android_logger = "0.14"
android-activity = { version = "0.6", features = ["native-activity"] }
