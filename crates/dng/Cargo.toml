[package]
name = "filmcraft-dng"
description = "Clean-room DNG / CinemaDNG camera RAW decoder (TIFF container, lossless JPEG, DNG colour pipeline)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["threads"]
threads = ["dep:rayon"]
# A small DNG and lossless JPEG writer for synthesising test files (not used by the app).
writer = []
# serde derives on the raw settings (`ProcessOptions`) for UI state and project files.
serde = ["dep:serde"]
# JPEG XL DNG (DNG 1.7, Compression 52546) through jxl-oxide (MIT OR Apache-2.0, pure Rust). Off by
# default: a new dependency, pending a maintainer decision.
jxl = ["dep:jxl-oxide"]

[dependencies]
rayon = { workspace = true, optional = true }
jxl-oxide = { version = "0.12", default-features = false, optional = true }
# Baseline (lossy) JPEG for Compression 34892 tiles: the JPEG decoder the workspace already uses
# (crates/codecs, crates/media), pure Rust.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
serde = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
filmcraft-dng = { path = ".", features = ["writer", "serde"] }
serde_json.workspace = true

[lints]
workspace = true
