[package]
name = "filmcraft-dng"
description = "Clean-room DNG / CinemaDNG camera RAW decoder (TIFF container, lossless JPEG, DNG colour pipeline)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["threads"]
threads = ["dep:rayon"]
# A small DNG and lossless JPEG writer for synthesising test files (not used by the app).
writer = []
# serde derives on the raw settings (`ProcessOptions`) for UI state and project files.
serde = ["dep:serde"]

[dependencies]
rayon = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
filmcraft-dng = { path = ".", features = ["writer", "serde"] }
serde_json.workspace = true

[lints]
workspace = true
