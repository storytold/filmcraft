[package]
name = "filmcraft-prores"
description = "Clean-room Apple ProRes (SMPTE RDD 36) decoder and encoder"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["threads"]
threads = ["dep:rayon"]
# `ReferenceBackend` and `rate_control_for_tests` for the tests of the crates that drive the
# backend seam (export, gpu): enabled only in their dev-dependencies, never shipped.
test-support = []

[dependencies]
filmcraft-bitstream = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true, optional = true }

[dev-dependencies]
filmcraft-testkit = { workspace = true }
