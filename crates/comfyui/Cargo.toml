[package]
name = "filmcraft-comfyui"
description = "FilmCraft ComfyUI bridge: API-format workflows, input bindings, the prompt / history / view protocol, and (feature `http`) a blocking HTTP transport"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# Talk to a ComfyUI server over HTTP(S) (pure-Rust TLS: rustls + RustCrypto, OS certificate
# verification). Off by default and in wasm builds.
http = ["dep:ureq", "dep:rustls", "dep:rustls-rustcrypto"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier"], optional = true }
rustls = { version = "0.23", default-features = false, optional = true }
rustls-rustcrypto = { version = "0.0.2-alpha", optional = true }
