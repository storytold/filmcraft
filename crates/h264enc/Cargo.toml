[package]
name = "filmcraft-h264enc"
description = "Clean-room pure-Rust H.264/AVC encoder (High 10/High/Main/Baseline, CABAC/CAVLC, B-frames, rate control)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["threads"]
threads = ["dep:rayon"]

[dependencies]
filmcraft-bitstream = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true, optional = true }

[dev-dependencies]
filmcraft-testkit = { workspace = true }
