[package]
name = "filmcraft-hevc"
description = "Clean-room pure-Rust H.265/HEVC decoder (ITU-T H.265)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["threads"]
threads = ["dep:rayon"]

[dependencies]
filmcraft-bitstream = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true, optional = true }

[target.'cfg(target_arch = "x86_64")'.dependencies]
# Safe runtime CPU dispatch; already used transitively by the workspace's GEMM crates.
pulp = { version = "0.22.3", default-features = false, features = ["std", "x86-v3"] }

[dev-dependencies]
filmcraft-testkit = { workspace = true }
