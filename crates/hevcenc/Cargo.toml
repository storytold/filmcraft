[package]
name = "filmcraft-hevcenc"
description = "Clean-room pure-Rust H.265/HEVC software encoder (Main, CABAC, P-frames, rate control)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["threads"]
threads = ["dep:rayon"]

[dependencies]
filmcraft-bitstream = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true, optional = true }

[dev-dependencies]
filmcraft-hevc = { workspace = true }
filmcraft-testkit = { workspace = true }
