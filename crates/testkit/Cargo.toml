[package]
name = "filmcraft-testkit"
description = "Test-only helpers: ffmpeg/ffprobe oracle discovery, fixture directories, golden-image comparison"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

# Used only as a dev-dependency. No FilmCraft dependencies, so any crate (including L0 codecs) can
# use it without creating dependency cycles.
[dependencies]
png = "0.18"
chrono = { workspace = true }

[dev-dependencies]
tempfile = "3.27"

