[package]
name = "filmcraft-av1enc"
description = "Clean-room pure-Rust baseline AV1 software encoder"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["threads"]
threads = ["dep:rayon"]

[dependencies]
filmcraft-bitstream = { workspace = true }
rayon = { workspace = true, optional = true }
thiserror = { workspace = true }

[dev-dependencies]
filmcraft-testkit = { workspace = true }
filmcraft-av1 = { workspace = true }
filmcraft-isobmff = { workspace = true }
