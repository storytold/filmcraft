[package]
name = "filmcraft-rotoscope"
description = "Bounded native EdgeTAM tracking and ViTMatte alpha inference"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
inference = ["dep:rten", "dep:rten-tensor", "dep:sha2"]

[dependencies]
filmcraft-time = { workspace = true }
filmcraft-project = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rten = { version = "=0.27.0", default-features = false, features = ["onnx_format"], optional = true }
rten-tensor = { version = "=0.27.0", optional = true }
sha2 = { version = "0.10", optional = true }

[[example]]
name = "oracle"
required-features = ["inference"]
