[package]
name = "filmcraft-export"
description = "Export pipeline: parallel render → encode → mux, presets, progress/cancel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
craft-audio = { workspace = true }
craft-jpeg = { git = "https://github.com/storytold/craft-libs", rev = "33be35625e252cc4f06aa375b3b428521faea37d" }
craft-exr = { workspace = true }
craft-png = { git = "https://github.com/storytold/craft-libs", rev = "33be35625e252cc4f06aa375b3b428521faea37d" }
craft-tga = { workspace = true }
craft-tiff = { workspace = true, features = ["plain-rgba16"] }
craft-dpx = { workspace = true }
craft-video = { workspace = true }
filmcraft-time = { workspace = true }
filmcraft-frame = { workspace = true }
filmcraft-color = { workspace = true }
filmcraft-media = { workspace = true }
craft-media = { workspace = true, features = ["mxf"] }
filmcraft-codecs = { workspace = true }
filmcraft-project = { workspace = true }
filmcraft-render = { workspace = true }
filmcraft-audio-dsp = { workspace = true }
filmcraft-geom = { workspace = true }
filmcraft-text = { workspace = true }
filmcraft-isobmff = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
log = { workspace = true }
web-time = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "tiff", "bmp"] }

[dev-dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
filmcraft-testkit = { workspace = true }
