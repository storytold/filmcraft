[package]
name = "filmcraft-format"
description = "FilmCraft .fcproj files: schema versions + migrations, atomic saves, auto-save naming and rotation, project thumbnails"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22"
filmcraft-project = { workspace = true }
filmcraft-media = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
# project thumbnails: JPEG written, JPEG or PNG read (pure Rust, MIT OR Apache-2.0; already used by export and media)
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = "3.27"

[dev-dependencies]
filmcraft-time = { workspace = true }
