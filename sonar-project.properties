sonar.projectKey=storytold_filmcraft
sonar.organization=storytold
# Setting test roots disables the CLI default; keep all production sources analyzed.
sonar.sources=.
# These exact fixture runners are tests, not production code. Do not exclude helpers.
sonar.tests=packaging
sonar.test.inclusions=packaging/nightly-tests.py,packaging/nightly-archive-tests.py,packaging/macos/nightly_plist_tests.py,packaging/macos/nightly_sign_tests.py,packaging/windows/nightly-package-tests.ps1,packaging/windows/nightly-signing-tests.ps1,packaging/nightly-release-tests.py
sonar.coverage.exclusions=**/tools/**,**/docs/**,**/examples/**,packaging/**
